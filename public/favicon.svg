        <feMergeNode in="blueGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="29" fill="#08090a" stroke="#292b2e" stroke-width="2" />
  <circle cx="32" cy="32" r="11" fill="url(#orb)" filter="url(#glow)" />
